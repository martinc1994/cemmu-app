version: '3.8'

services:
  # Base de Datos PostgreSQL
  cemmu-db:
    image: postgres:15-alpine
    container_name: cemmu-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-martinc1224}
      POSTGRES_DB: ${DB_NAME:-cemmu_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cemmu-network

  # Aplicación Web CeMMU
  cemmu-app:
    build: .
    container_name: cemmu-app
    restart: always
    depends_on:
      - cemmu-db
    environment:
      - PORT=3000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-martinc1224}
      - DB_HOST=cemmu-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cemmu_db}
      - SECRET_TOKEN=${SECRET_TOKEN:-Transporte2025!}
      - JWT_SECRET=${JWT_SECRET:-CeMMU_JWT_S3cr3t_2025!}
      - EVIDENCE_STORAGE_PATH=/usr/src/app/data/evidencia
      - EVIDENCE_ENCRYPTION_KEY=${EVIDENCE_ENCRYPTION_KEY:-2fc4292bf579cb2b2780658cdcab40e8ea1db05bc6854fe188130b8941eddd51}
      - EVIDENCE_MAX_FILE_SIZE_MB=${EVIDENCE_MAX_FILE_SIZE_MB:-50}
      - NODE_ENV=production
    volumes:
      - ./data/evidencia:/usr/src/app/data/evidencia
    ports:
      - "3000:3000"
    networks:
      - cemmu-network

volumes:
  pgdata:

networks:
  cemmu-network:
    driver: bridge
