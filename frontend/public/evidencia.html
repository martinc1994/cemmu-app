<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CeMMU - Cargar Evidencia Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <style>
    .container {
      width: 90%;
      max-width: 600px;
      margin: 20px auto 40px auto;
    }
    .form-card {
      background: var(--color-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 30px;
      border: 1px solid var(--color-border);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .full-width {
      grid-column: span 2;
    }
    .drop-zone {
      border: 2px dashed var(--color-primary);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      background: rgba(59, 130, 246, 0.04);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: rgba(59, 130, 246, 0.12);
      border-color: var(--color-primary-hover);
    }
    .drop-zone-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .drop-zone-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .drop-zone-subtext {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 4px;
    }
    #fileInput {
      display: none;
    }
    .file-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 0.88rem;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--color-border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--color-primary);
      width: 0%;
      transition: width 0.2s ease;
    }
    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }
    .radio-card {
      border: 2px solid var(--color-border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      background: var(--color-bg);
    }
    .radio-card:hover {
      border-color: var(--color-primary);
    }
    .radio-card input[type="radio"] {
      width: auto;
      margin: 0;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-secondary {
      background: var(--color-secondary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="themeToggle">🌙</button>

  <div class="container">
    <div class="nav-buttons">
      <h2 style="margin: 0;">📤 Cargar Evidencia Digital</h2>
      <div style="display: flex; gap: 10px;">
        <button class="btn-secondary" style="background: #8b5cf6;" onclick="location.href='/repositorio'">📂 Repositorio</button>
        <button class="btn-secondary" onclick="location.href='/'">Volver</button>
      </div>
    </div>

    <form id="evidenciaForm" class="form-card">
      <div class="form-grid">
        <div>
          <label for="linea">Línea / Ramal *</label>
          <select id="linea" required>
            <option value="">Seleccione...</option>
            <option value="L1 Mitre">L1 Mitre</option>
            <option value="L1 Salta">L1 Salta</option>
            <option value="L3 Marcos Paz">L3 Marcos Paz</option>
            <option value="L3 Lavalle">L3 Lavalle</option>
            <option value="L3 Auxiliar">L3 Auxiliar</option>
            <option value="L4 Mercofrut">L4 Mercofrut</option>
            <option value="L4 Colombres">L4 Colombres</option>
            <option value="L4 Colombres-Costanera">L4 Colombres-Costanera</option>
            <option value="L4 Mercofrut-Autopista">L4 Mercofrut-Autopista</option>
            <option value="L4 Mercofrut-A. Heredia">L4 Mercofrut-A. Heredia</option>
            <option value="L5 El Molino-SEOC">L5 El Molino-SEOC</option>
            <option value="L5 Oeste x 25">L5 Oeste x 25</option>
            <option value="L5 Oeste x Dean Funes">L5 Oeste x Dean Funes</option>
            <option value="L5 Agrimensor">L5 Agrimensor</option>
            <option value="L6 San Alberto">L6 San Alberto</option>
            <option value="L6 San Jose x Cangallo">L6 San Jose x Cangallo</option>
            <option value="L6 San Jose x Democracia">L6 San Jose x Democracia</option>
            <option value="L7 O' connors">L7 O' connors</option>
            <option value="L7 AGET">L7 AGET</option>
            <option value="L8 El Bosque">L8 El Bosque</option>
            <option value="L8 San Cayetano x S. Peña">L8 San Cayetano x S. Peña</option>
            <option value="L8 San Cayetano x B. Teran">L8 San Cayetano x B. Teran</option>
            <option value="L9 Viamonte">L9 Viamonte</option>
            <option value="L9 Bulnes">L9 Bulnes</option>
            <option value="L10 San Cayetano">L10 San Cayetano</option>
            <option value="L10 V. Amalia">L10 V. Amalia</option>
            <option value="L11 V. Angelina">L11 V. Angelina</option>
            <option value="L11 B 11 de Marzo">L11 B 11 de Marzo</option>
            <option value="L11 Manantial Sur">L11 Manantial Sur</option>
            <option value="L12 SMATA Manantial Sur">L12 SMATA Manantial Sur</option>
            <option value="L12 SMATA San Miguel">L12 SMATA San Miguel</option>
            <option value="L12 Municipal">L12 Municipal</option>
            <option value="L17 Chañaritos">L17 Chañaritos</option>
            <option value="L17 Alem-Universidad">L17 Alem-Universidad</option>
            <option value="L17 Roca-Universidad">L17 Roca-Universidad</option>
            <option value="L17 Teran-San Lorenzo">L17 Teran-San Lorenzo</option>
            <option value="L17 Teran-Roca">L17 Teran-Roca</option>
            <option value="L17 Ejercito Arg">L17 Ejercito Arg</option>
            <option value="L18 Horario">L18 Horario</option>
            <option value="L18 Antihorario">L18 Antihorario</option>
            <option value="L19 Horario">L19 Horario</option>
            <option value="L19 Antihorario">L19 Antihorario</option>
          </select>
        </div>

        <div>
          <label for="interno">Interno *</label>
          <input type="number" id="interno" placeholder="Ej: 42" required />
        </div>

        <div class="full-width">
          <label>Cámara Origen *</label>
          <div class="radio-group">
            <label class="radio-card">
              <input type="radio" name="camara" value="frontal" required checked> 📹 Frontal (calle)
            </label>
            <label class="radio-card">
              <input type="radio" name="camara" value="escalera"> 🪜 Escalera ascenso
            </label>
            <label class="radio-card">
              <input type="radio" name="camara" value="chofer"> 🚘 Asiento chofer
            </label>
            <label class="radio-card">
              <input type="radio" name="camara" value="interior"> 🚍 Fondo interior
            </label>
          </div>
        </div>

        <div>
          <label for="fecha_evento">Fecha del evento *</label>
          <input type="date" id="fecha_evento" required />
        </div>

        <div>
          <label for="hora_evento">Hora aproximada</label>
          <input type="time" id="hora_evento" step="1" />
        </div>

        <div class="full-width">
          <label for="expediente">N° de Expediente / Oficio Judicial</label>
          <input type="text" id="expediente" placeholder="Ej: MPF-2026-0834 (máx 4 archivos por expediente)" />
        </div>

        <div class="full-width">
          <label for="organismo_solicitante">Organismo Solicitante</label>
          <select id="organismo_solicitante">
            <option value="">Seleccione o ingrese...</option>
            <option value="Ministerio Público Fiscal">Ministerio Público Fiscal</option>
            <option value="Fiscalía General">Fiscalía General</option>
            <option value="Juzgado de Instrucción N°1">Juzgado de Instrucción N°1</option>
            <option value="Juzgado de Instrucción N°2">Juzgado de Instrucción N°2</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="full-width">
          <label for="descripcion">Descripción del hecho / Evento *</label>
          <textarea id="descripcion" rows="3" placeholder="Detallé brevemente el evento captado según el requerimiento oficial..." required></textarea>
        </div>

        <div class="full-width">
          <label>Archivo de Video / Evidencia *</label>
          <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text" id="dropZoneText">Arrastrá un archivo aquí o hacé click para seleccionar</div>
            <div class="drop-zone-subtext">Formatos permitidos: MP4, AVI, MOV, MKV, JPG, PNG, PDF (Máx. 50MB)</div>
          </div>
          <input type="file" id="fileInput" accept="video/*,image/*,.pdf" />

          <div class="file-preview" id="filePreview" style="display: none;">
            <span id="fileName">archivo.mp4</span>
            <button type="button" style="background: none; border: none; color: var(--color-danger); cursor: pointer; font-weight: bold;" onclick="clearFile()">❌</button>
          </div>

          <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" style="width: 100%; margin-top: 20px;">🔒 Cargar y Encriptar Evidencia</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/evidencia.js"></script>
</body>
</html>
