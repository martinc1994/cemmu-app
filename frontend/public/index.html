<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Monitoreo - Registro de Flota</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <button id="themeToggle">🌙</button>

    <header>
      <img src="img/logo.png" alt="logo">
      <h1>Centro de Monitoreo</h1>
      <p>Registro de pasos de flota</p>
      
      <div id="userInfo" style="margin-top: 10px; font-size: 0.9em; font-weight: bold; color: var(--color-primary)"></div>
      <div style="margin-top:15px; display:flex; justify-content:center; gap: 8px; flex-wrap: wrap;">
        <button type="button" id="adminBtn" class="btn-pill" style="display:none;" onclick="location.href='/admin'">🛡️ Admin</button>
        <button type="button" id="usersBtn" class="btn-pill" style="display:none;" onclick="location.href='/usuarios'">👥 Usuarios</button>
        <button type="button" id="repoBtn" class="btn-pill" onclick="location.href='/repositorio'">📂 Repositorio</button>
        <button type="button" class="btn-pill" onclick="location.href='/cambiar-clave'">🔑 Clave</button>
        <button type="button" class="btn-pill" onclick="localStorage.removeItem('cemmu_user'); localStorage.removeItem('cemmu_token'); location.href='/login'">Cerrar Sesión</button>
      </div>
    </header>

    <form id="registroForm">
      <label for="operadorLogin">Operador Actual</label>
      <input type="text" id="operadorLogin" readonly style="background:#e5e7eb; color:#6b7280; cursor:not-allowed;" />

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" readonly />

    <label for="hora">Hora del paso</label>
    <input type="time" id="hora" step="1" required />

    <label for="linea">Línea / Ramal</label>
    <select id="linea" required>
      <option value="">Seleccione línea / ramal...</option>
      <optgroup label="Línea 1">
        <option value="L1 Mitre" data-direccion="9 de Julio 1900">L1 Mitre</option>
        <option value="L1 Salta" data-direccion="9 de Julio 1900">L1 Salta</option>
      </optgroup>
      <optgroup label="Línea 3">
        <option value="L3 Lavalle" data-direccion="Lavalle 2300">L3 Lavalle</option>
        <option value="L3 Piedras" data-direccion="General Paz 2300">L3 Piedras</option>
      </optgroup>
      <optgroup label="Línea 4">
        <option value="L4 Colombres" data-direccion="Mario Bravo 400">L4 Colombres</option>
        <option value="L4 Colombres Costanera" data-direccion="Mario Bravo 400">L4 Colombres Costanera</option>
        <option value="L4 Mercofrut" data-direccion="Av. Democracia 50">L4 Mercofrut</option>
        <option value="L4 Mercofrut Alejandro Heredia" data-direccion="Av. Democracia 50">L4 Mercofrut Alejandro Heredia</option>
        <option value="L4 Mercofrut Autopista" data-direccion="Av. Democracia 50">L4 Mercofrut Autopista</option>
      </optgroup>
      <optgroup label="Línea 5">
        <option value="L5 Agrimensor" data-direccion="25 de Mayo 1900">L5 Agrimensor</option>
        <option value="L5 B. Oeste (25 de Mayo)" data-direccion="25 de Mayo 1900">L5 B. Oeste (25 de Mayo)</option>
        <option value="L5 B. Oeste (Funes)" data-direccion="25 de Mayo 1900">L5 B. Oeste (Funes)</option>
        <option value="L5 El Molino (SEOC)" data-direccion="25 de Mayo 1900">L5 El Molino (SEOC)</option>
      </optgroup>
      <optgroup label="Línea 6">
        <option value="L6 San Alberto" data-direccion="Buenos Aires 1700">L6 San Alberto</option>
        <option value="L6 San José (Cangallo)" data-direccion="Buenos Aires 1700">L6 San José (Cangallo)</option>
        <option value="L6 San José (Democracia)" data-direccion="Buenos Aires 1700">L6 San José (Democracia)</option>
      </optgroup>
      <optgroup label="Línea 7">
        <option value="L7 AGET" data-direccion="Rivadavia 2100">L7 AGET</option>
        <option value="L7 Occonors" data-direccion="Rivadavia 2100">L7 Occonors</option>
      </optgroup>
      <optgroup label="Línea 8">
        <option value="L8 El Bosque" data-direccion="Av. Benjamín Aráoz 950">L8 El Bosque</option>
        <option value="L8 San Cayetano (Sáenz Peña)" data-direccion="Berutti 500">L8 San Cayetano (Sáenz Peña)</option>
        <option value="L8 San Cayetano (Terán)" data-direccion="Berutti 500">L8 San Cayetano (Terán)</option>
      </optgroup>
      <optgroup label="Línea 9">
        <option value="L9 Bulnes" data-direccion="Av. Pres. Néstor Kirchner 2300">L9 Bulnes</option>
        <option value="L9 Viamonte" data-direccion="Av. Pres. Néstor Kirchner 2300">L9 Viamonte</option>
      </optgroup>
      <optgroup label="Línea 10">
        <option value="L10 San Cayetano" data-direccion="Berutti 200">L10 San Cayetano</option>
        <option value="L10 Villa Amalia" data-direccion="Congreso 2700">L10 Villa Amalia</option>
      </optgroup>
      <optgroup label="Línea 11">
        <option value="L11 11 de Marzo" data-direccion="Av. Américo Vespucio 1700">L11 11 de Marzo</option>
        <option value="L11 Manantial Sur" data-direccion="Antonio Perez Palavecino 2899">L11 Manantial Sur</option>
        <option value="L11 Villa Angelina" data-direccion="Jujuy 4300">L11 Villa Angelina</option>
      </optgroup>
      <optgroup label="Línea 12">
        <option value="L12 Municipal" data-direccion="Ramírez de Velazco 1700">L12 Municipal</option>
        <option value="L12 Smata" data-direccion="Santiago del Estero 200">L12 Smata</option>
      </optgroup>
      <optgroup label="Línea 17">
        <option value="L17 Alem Universidad" data-direccion="Alem 1200">L17 Alem Universidad</option>
        <option value="L17 Chañaritos" data-direccion="Amador Lucero 3200">L17 Chañaritos</option>
        <option value="L17 Ejército Argentino" data-direccion="Alem 1200">L17 Ejército Argentino</option>
        <option value="L17 Roca Universidad" data-direccion="Alem 1200">L17 Roca Universidad</option>
        <option value="L17 Terán Roca" data-direccion="Alem 1200">L17 Terán Roca</option>
        <option value="L17 Terán San Lorenzo" data-direccion="Alem 1200">L17 Terán San Lorenzo</option>
      </optgroup>
      <optgroup label="Línea 18">
        <option value="L18 Antihorario" data-direccion="Av. Sáenz Peña 800">L18 Antihorario</option>
        <option value="L18 Horario" data-direccion="Av. Sáenz Peña 800">L18 Horario</option>
      </optgroup>
      <optgroup label="Línea 19">
        <option value="L19 Antihorario" data-direccion="Av. América 1700">L19 Antihorario</option>
        <option value="L19 Horario" data-direccion="Av. América 1700">L19 Horario</option>
      </optgroup>
    </select>

    <label for="direccion">Punto de control <small style="font-weight: normal; color: var(--color-text-muted); font-size: 0.8rem;">(asignado según recorrido)</small></label>
    <input type="text" id="direccion" readonly placeholder="Se autocompleta con el recorrido..." required />

    <label for="interno">Interno</label>
    <input type="number" id="interno" required />

    <label for="observaciones">Observaciones</label>
    <textarea id="observaciones" rows="2"></textarea>

    <button type="submit">Guardar Registro</button>
  </form>

  <div class="historial">
    <h3>Últimos registros</h3>
    <ul id="historialLista"></ul>
  </div>

  <footer>©2026 Secretaría de Movilidad Urbana</footer>

  <div id="toast" class="toast"></div>

  <script src="js/recorridos.js"></script>
  <script src="js/app.js"></script>

  <div class="footer-municipio-logo">
    <img src="img/smt_black.png" alt="Municipalidad de San Miguel de Tucumán" class="logo-smt-black" />
    <img src="img/smt_white.png" alt="Municipalidad de San Miguel de Tucumán" class="logo-smt-white" />
  </div>
</body>
</html>
